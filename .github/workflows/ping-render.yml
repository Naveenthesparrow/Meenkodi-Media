name: scheduled-ping
on:
  schedule:
    - cron: '*/15 * * * *' # run every 15 minutes, but job will skip outside active window
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      TARGET_TZ: 'Asia/Kolkata'    # change to your timezone (IANA name)
      START_HOUR: '6'              # local start hour (inclusive)
      END_HOUR: '1'                # local end hour (exclusive)
      HEALTH_URL: 'https://www.meenkodi.com/api/health' # updated to your site
    steps:
      - name: conditional ping during active hours
        run: |
          # determine current hour in TARGET_TZ
          hour=$(TZ=$TARGET_TZ date +%H)
          hour=${hour#0}
          start=$START_HOUR
          end=$END_HOUR
          inside=0
          if [ "$start" -le "$end" ]; then
            if [ $hour -ge $start ] && [ $hour -lt $end ]; then inside=1; fi
          else
            # window wraps midnight
            if [ $hour -ge $start ] || [ $hour -lt $end ]; then inside=1; fi
          fi
          if [ $inside -ne 1 ]; then
            echo "Outside active window for $TARGET_TZ ($hour); skipping ping."
            exit 0
          fi
          echo "Inside active window for $TARGET_TZ ($hour); pinging $HEALTH_URL"
          curl -sS --max-time 8 "$HEALTH_URL" -o /dev/null || true
