services:
  - type: web
    name: Meenkodi-Server
    env: node
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
    branch: main
    plan: free
    region: oregon
    # Build the client first so `client/dist` is available, then install server deps
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js

  - type: static_site
    name: Meenkodi-Client (optional)
    env: static
    branch: main
    plan: free
    region: oregon
    # After Vite build, run the pre-render script to generate per-route HTML files
    # The pre-render script fetches live content from the production API and writes
    # gallery/index.html, articles/index.html, articles/:id/index.html etc. into dist/
    buildCommand: cd client && npm install --include=dev && npm run build:ssr
    publishPath: client/dist
