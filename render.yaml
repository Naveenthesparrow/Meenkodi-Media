services:
  - type: web
    name: Meenkodi-Server
    env: node
    branch: main
    plan: free
    region: oregon
    # Build the client first so `client/dist` is available, then install server deps
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd server && node index.js

  - type: static_site
    name: Meenkodi-Client (optional)
    env: static
    branch: main
    plan: free
    region: oregon
    buildCommand: cd client && npm install && npm run build
    publishPath: client/dist
